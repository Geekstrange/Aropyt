name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behavior you observed. Be specific — what did you do, what did you see?
      placeholder: |
        Example: After pressing `Ctrl+Shift+B` the sidebar opens, but keyboard focus stays in the editor — `j`/`k` type characters instead of navigating the file tree.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. Open Aropyt
        2. Open any .md file
        3. Press Ctrl+Shift+B
        4. Press j
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: >-
        Open the Debug panel (F12) and click **Copy Report**. Paste the report here.
        This includes version, platform, settings snapshot, performance metrics and
        recent logs — it is usually enough to reproduce the problem without extra
        questions.
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: file-type
    attributes:
      label: File type involved
      options:
        - Markdown (.md)
        - LaTeX (.tex)
        - Fountain (.fountain)
        - Not file-related
        - Not sure

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, sample files, or anything else that helps. Screenshots of the Debug panel are welcome when the diagnostic report cannot be copied.
