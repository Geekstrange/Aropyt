# Aropyt 三平台发布构建。
#
# 触发：推送 v* 标签（git tag v0.0.1 && git push --tags）。
# 产物：Windows（exe/msi）、macOS（dmg/app）、Linux（AppImage/deb），
#       由 tauri-action 自动创建 GitHub Release 草稿并上传。
#
# Linux 必须装 WebKitGTK 系依赖（Tauri 2 用 4.1 API）——
# 这也是 Linux 包只能在 Linux 上编译的原因（无法从 Windows 交叉编译）。

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (WebKitGTK 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aropyt v__VERSION__'
          releaseBody: 'Typora 式 Markdown 编辑器。详见 README。'
          releaseDraft: true
          prerelease: false
