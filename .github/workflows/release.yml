# Aropyt 三平台发布构建。
#
# 触发：推送 v* 标签（git tag v0.0.1 && git push --tags）。
# 产物：Windows（exe）、macOS（dmg/app）、Linux（AppImage/deb），
#       由 tauri-action 自动创建 GitHub Release 草稿并上传。
#
# Windows 只出 NSIS（exe）：MSI 从来不是用户的安装方式，构建它纯属白跑一遍
# WiX。商店提交走 MSIX，那是独立的一条流水线（见 docs/releases/v0.1.5.md）。
#
# Linux 必须装 WebKitGTK 系依赖（Tauri 2 用 4.1 API）——
# 这也是 Linux 包只能在 Linux 上编译的原因（无法从 Windows 交叉编译）。

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 先建 Release，避免多个 build job 并发创建（Resource not accessible） ──
  #
  # tauri-action 在每个 job 里都会"查找 Release，找不到就创建"。5 个平台
  # 并行时它们几乎同时查不到 → 同时创建 → 竞态报错
  # （Resource not accessible by integration，实测）。
  # 这里用 gh 先建好（幂等：已存在则跳过），build job 只负责上传资产。
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release if absent
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在"
          else
            NOTES="docs/releases/${TAG}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "Aropyt $TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" --title "Aropyt $TAG" --notes "Aropyt $TAG"
            fi
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          # Windows ARM64：x64 runner 交叉编译，**只出 NSIS**（WiX 对 arm64 支持不完整）
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          # Linux ARM64：用 GitHub 原生 arm64 runner，不做交叉编译
          - platform: ubuntu-24.04-arm
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        if: contains(matrix.args, 'aarch64-pc-windows-msvc')
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Linux dependencies (WebKitGTK 等)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      # release notes 与 Release 创建都在 prepare-release 里完成，
      # 这里只负责构建 + 把资产传上去（releaseId 直接复用，不再查找）。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aropyt ${{ github.ref_name }}'
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # ── MSIX 输入（仅 Windows）────────────────────────────────
      #
      # MSIX 装的是**裸 exe**，不是 setup.exe —— 所以不能像 APK 那样从
      # Release 下载现成资产再打包，必须在产出它的 job 里顺手暂存。
      # 这样 msix job 不需要重跑一遍 cargo build（那要多花十几分钟）。
      - name: Stage bare exe for MSIX (x64)
        if: matrix.platform == 'windows-latest' && !contains(matrix.args, 'aarch64')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix-input/x64 | Out-Null
          Copy-Item src-tauri/target/release/Aropyt.exe msix-input/x64/
          if (Test-Path src-tauri/target/release/Aropyt.pdb) {
            Copy-Item src-tauri/target/release/Aropyt.pdb msix-input/x64/
          }

      - name: Stage bare exe for MSIX (arm64)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, 'aarch64')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix-input/arm64 | Out-Null
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/Aropyt.exe msix-input/arm64/
          if (Test-Path src-tauri/target/aarch64-pc-windows-msvc/release/Aropyt.pdb) {
            Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/Aropyt.pdb msix-input/arm64/
          }

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: msix-input-${{ contains(matrix.args, 'aarch64') && 'arm64' || 'x64' }}
          # 指到架构子目录而不是 msix-input 整体：artifact 的根就是这里的目录，
          # 下载回来才是 msix-input/msix-input-x64/{Aropyt.exe,Aropyt.pdb}。
          # 给外层的 msix-input，里面会多套一层 x64/，路径就和调用方对不上了。
          path: msix-input/${{ contains(matrix.args, 'aarch64') && 'arm64' || 'x64' }}
          if-no-files-found: error
          # 比"够用一次"留点余量：只 rerun 失败的 msix job 时，
          # 上一步的 artifact 还在（1 天的话隔天重试就直接失败）
          retention-days: 3

      # ── macOS 完整性门禁（issue #1）──────────────────────────
      # 签名声明带资源目录而 _CodeSignature/CodeResources 缺失时，
      # Gatekeeper 报"已损坏"而不是"未识别的开发者"（实测）。
      # 这里对打包产物做深校验，坏包直接 fail，不让它流到 Release。
      - name: Verify macOS bundle integrity
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -e
          APP=$(find src-tauri/target -name "*.app" -path "*release*" | head -1)
          echo "Verifying: $APP"
          test -n "$APP"
          if [ ! -d "$APP/Contents/_CodeSignature" ]; then
            echo "::error::$APP is missing Contents/_CodeSignature — Gatekeeper will report it as damaged"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          echo "Bundle integrity OK"


  # ── 微软商店提交件（MSIX）───────────────────────────────────
  #
  # 只产出 .msixupload，不上架任何东西 —— 上传是人工动作：
  # 从 Release 把它下载下来，拖进 Partner Center 的「包」页面。
  #
  # 为什么单独一个 job 而不是塞进 build：msixbundle 必须同时拿到 x64 与
  # arm64 的裸 exe，而它们是在两个矩阵 job 里分别编译的。用 artifact 把
  # 两者汇合，比在一个 job 里编译两遍便宜得多。
  msix:
    permissions:
      contents: write
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: msix-input-*
          path: msix-input

      - name: Pack MSIX bundle
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          # 按架构**搜索** exe，而不是写死 msix-input/msix-input-x64/Aropyt.exe。
          # artifact 的目录层级取决于上传时的 path 写法，写死路径的下场是：
          # 上传那边一调整，这里就找不到文件，而报错发生在 makeappx 那一层，
          # 看起来像"打包工具的问题"。搜不到就直接 throw，错误信息说人话。
          function Find-Package([string]$arch) {
            $exe = Get-ChildItem msix-input -Recurse -Filter 'Aropyt.exe' -File |
              Where-Object { $_.FullName -match [regex]::Escape($arch) } |
              Select-Object -First 1
            if (-not $exe) { throw "msix-input 下找不到 $arch 的 Aropyt.exe（artifact 没下下来？）" }
            $pdb = Join-Path $exe.DirectoryName 'Aropyt.pdb'
            return [pscustomobject]@{ Exe = $exe.FullName; Pdb = $(if (Test-Path $pdb) { $pdb } else { '' }) }
          }

          $x64 = Find-Package 'x64'
          $arm64 = Find-Package 'arm64'
          Write-Host "x64:   $($x64.Exe)"
          Write-Host "arm64: $($arm64.Exe)"

          ./src-tauri/msix/pack.ps1 -Arch x64 -Exe $x64.Exe -Pdb $x64.Pdb -Version $version
          ./src-tauri/msix/pack.ps1 -Arch arm64 -Exe $arm64.Exe -Pdb $arm64.Pdb -Version $version
          ./src-tauri/msix/bundle.ps1 -Version $version

      # 同时留一份 workflow artifact：Release 上传失败时还能从 Actions 页面取包，
      # 不至于为了一个 10MB 的文件重跑整条流水线。
      - uses: actions/upload-artifact@v4
        with:
          name: msix-upload
          path: src-tauri/target/msix/*.msixupload

      - name: Attach store package to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = (Get-ChildItem src-tauri/target/msix/*.msixupload).FullName
          Write-Host "上传 $file"
          # --clobber 是给"同一次 tag 重跑流水线"用的（临时性失败很常见）。
          # 它不等于"可以换二进制"：一旦这个包被提交到 Partner Center，
          # 就只能发新 tag，见 src-tauri/msix/README.md。
          gh release upload "$env:GITHUB_REF_NAME" $file --clobber


  # ── Android APK（release 签名）──────────────────────────────
  # gen/android 不提交：CI 里 tauri android init 生成，
  # 签名经 Gradle init script（scripts/init-release-signing.gradle）注入，
  # 不修改 init 生成的任何文件。
  # keystore 从 Secrets 解码；needs: build 等 tauri-action 建好 Release 再附加。
  android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner 镜像已预装 Android SDK + NDK（$ANDROID_HOME）。
      # 不用 android-actions/setup-android@v3：它默认安装已废弃的 'tools' 包，
      # 在新版 runner 的 sdkmanager 上直接失败（实测）。这里只补 licenses。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install frontend dependencies
        run: npm install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Init Android project
        run: npm run tauri android init

      - name: Install signing init script
        # init script 在 Gradle 模型就绪后注入签名，完全不修改
        # tauri android init 生成的 build.gradle.kts —— patch 方案实测
        # 三轮失败（import 冲突 / 未定义引用 / 受限作用域），已弃用。
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/init-release-signing.gradle ~/.gradle/init.d/release-signing.gradle

      - name: Ensure gradlew is executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Move keystore into project
        run: |
          mv release.keystore src-tauri/gen/android/release.keystore
          mv keystore.properties src-tauri/gen/android/keystore.properties

      - name: Build APK (aarch64)
        run: npm run tauri android build -- --apk --target aarch64

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs -name "*.apk" -path "*release*" | head -1)
          echo "APK: $APK"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Aropyt $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber