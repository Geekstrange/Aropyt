# Aropyt 三平台发布构建。
#
# 触发：推送 v* 标签（git tag v0.0.1 && git push --tags）。
# 产物：Windows（exe/msi）、macOS（dmg/app）、Linux（AppImage/deb），
#       由 tauri-action 自动创建 GitHub Release 草稿并上传。
#
# Linux 必须装 WebKitGTK 系依赖（Tauri 2 用 4.1 API）——
# 这也是 Linux 包只能在 Linux 上编译的原因（无法从 Windows 交叉编译）。

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (WebKitGTK 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aropyt ${{ github.ref_name }}'
          releaseBody: |
            Aropyt v__VERSION__ —— Typora 式 Markdown 编辑器。

            ## 本次更新（v0.0.7：编辑历史 + 数据备份）

            ### 编辑历史

            - **保存即版本**：每次保存自动记录一个版本（内容未变不重复记录）
            - **自动保存版本**：可设间隔（默认 60 秒），写作途中不怕崩
            - **手动命名版本**：给重要节点留个里程碑
            - **一键恢复**：恢复前自动把当前内容存为"恢复前快照"，任何操作都不丢内容
            - 每个文件保留最近 N 个版本（默认 50，可在设置调整），更早的自动淘汰
            - 工具栏新增编辑历史入口，版本列表显示时间 / 标签 / 大小
            - 单版本上限 4MB；写入原子化，断电不留半截数据

            ### 数据导出 / 导入

            - 设置面板新增「数据备份」：一键导出**全部草稿与编辑历史**为单个 JSON
            - 导入会覆盖现有数据（导入前有明确警告与数量确认）
            - 用途：换机器、重装系统、跨平台迁移、备份存档
            - 文件可读可手工修，与系统路径完全解耦

            ### 其他

            - 修复 CI：Windows/macOS/Linux 三平台构建恢复
            - 工具栏新增编辑历史图标

            ## 安装

            - **Windows**：`*-setup.exe`（推荐）或 `.msi`
            - **macOS**：`.dmg`（Apple Silicon 选 aarch64）
            - **Linux**：`.AppImage`（免安装）或 `.deb`
            - **Android**：`.apk`（debug 签名，安装时允许未知来源）

            > macOS 未签名，首次打开需右键 → 打开，或到系统设置放行。

            ## 已知限制

            - 历史面板暂不显示**版本间 diff**（下一版加入）
            - 编辑历史的自动保存间隔最短 15 秒
            - `.tex` / `.fountain` 渲染需插件支持（后续版本）

            ## 链接

            - 文档与源码：https://github.com/Geekstrange/Aropyt#readme
            - 问题反馈：https://github.com/Geekstrange/Aropyt/issues

            许可证：AGPL-3.0


  # ── Android APK（release 签名）──────────────────────────────
  # gen/android 不提交：CI 里 tauri android init 生成，
  # scripts/patch-android-gradle.py 注入签名配置（幂等）。
  # keystore 从 Secrets 解码；needs: build 等 tauri-action 建好 Release 再附加。
  android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner 镜像已预装 Android SDK + NDK（$ANDROID_HOME）。
      # 不用 android-actions/setup-android@v3：它默认安装已废弃的 'tools' 包，
      # 在新版 runner 的 sdkmanager 上直接失败（实测）。这里只补 licenses。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install frontend dependencies
        run: npm install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Init Android project
        run: npm run tauri android init

      - name: Patch Gradle signing
        run: python3 scripts/patch-android-gradle.py

      - name: Ensure gradlew is executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Move keystore into project
        run: |
          mv release.keystore src-tauri/gen/android/release.keystore
          mv keystore.properties src-tauri/gen/android/keystore.properties

      - name: Build APK (aarch64)
        run: npm run tauri android build -- --apk --target aarch64

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs -name "*.apk" -path "*release*" | head -1)
          echo "APK: $APK"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Aropyt $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber